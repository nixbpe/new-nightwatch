# Local development dependencies ONLY: isolated PostgreSQL, Mailpit SMTP
# capture, and ephemeral Redis transport. Managed through `bun run db:*`
# (scripts/db.mjs), which computes the per-worktree ports/project name and
# supplies the gitignored database/auth secrets file.
# Do not add production services and do not commit real credentials here.
name: nw-dev-${NW_SLOT:?run via bun run db:up}
services:
  postgres:
    # pgrust (Rust rewrite targeting PostgreSQL 18.6) is for local development
    # only; CI (.github/workflows/ci.yml) still runs postgres:17.11-alpine.
    image: malisper/pgrust:v0.3
    environment:
      # Container superuser = owner role: DDL/migrations/provisioning only.
      # The application and tests connect as `nightwatch` (least privilege,
      # NOBYPASSRLS), created by scripts/db/init/001-roles.sh on first start.
      POSTGRES_USER: nightwatch_owner
      POSTGRES_PASSWORD: ${NW_OWNER_PASSWORD:?run bun run db:up}
      POSTGRES_DB: nightwatch
      NW_DB_PASSWORD: ${NW_DB_PASSWORD:?run bun run db:up}
    ports:
      - "127.0.0.1:${NW_DB_PORT:?run bun run db:up}:5432"
    volumes:
      # pgrust 0.3 refuses a PostgreSQL 17 data directory ("database files are
      # incompatible with server"), so it gets a fresh volume; pgdata stays.
      - pgrust-data:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightwatch_owner -d nightwatch"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.31.1
    # In-memory capture only: messages reset when the container restarts.
    # No UI auth — loopback binding is the access control.
    ports:
      - "127.0.0.1:${NW_MAIL_SMTP_PORT:?run bun run db:up}:1025"
      - "127.0.0.1:${NW_MAIL_UI_PORT:?run bun run db:up}:8025"

  redis:
    # Transport only: durable notification state remains in PostgreSQL.
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    # Image declares VOLUME /data; with persistence off, tmpfs avoids a volume.
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${NW_REDIS_PORT:?run bun run db:up}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
volumes:
  pgrust-data:
