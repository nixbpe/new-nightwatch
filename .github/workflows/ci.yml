# NightWatch CI — parallel blocking quality gates plus a dispatch-only
# release-stage job. Every blocking job invokes the same root/package
# commands as local development, so `bun run <script>` locally reproduces CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Release-stage job (e2e + container) runs only on manual dispatch until
  # the domain apps and the T9 Dockerfile land.
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.2
  # Pinned scanner versions — keep in sync with local installs.
  SEMGREP_VERSION: 1.176.1
  GITLEAKS_VERSION: 8.30.1
  TRIVY_VERSION: 0.74.0

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run codegen:check
      - run: bun run typecheck

  # Coverage is measured and uploaded on every run; thresholds fail the build
  # because COVERAGE_GATE=1 is set (first domain feature: auth/onboarding).
  # The job runs against real PostgreSQL + Mailpit services with the
  # least-privilege runtime role — no mocks for DB-backed checks.
  test:
    name: unit tests + coverage
    runs-on: ubuntu-latest
    env:
      COVERAGE_GATE: "1"
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://nightwatch:nightwatch_ci@localhost:5432/nightwatch
      DATABASE_OWNER_URL: postgres://nightwatch_owner:nightwatch_owner_ci@localhost:5432/nightwatch
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: NightWatch CI <ci@nightwatch.local>
    services: &db_services
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: nightwatch_owner
          POSTGRES_PASSWORD: nightwatch_owner_ci
          POSTGRES_DB: nightwatch
          NW_DB_PASSWORD: nightwatch_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U nightwatch_owner -d nightwatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - "1025:1025"
          - "8025:8025"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Generate development secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Create least-privilege runtime database role
        run: |
          docker run --rm --network host \
            -v "$PWD/scripts/db/init:/init:ro" \
            -e POSTGRES_USER=nightwatch_owner \
            -e POSTGRES_DB=nightwatch \
            -e POSTGRES_HOST=localhost \
            -e PGPASSWORD=nightwatch_owner_ci \
            -e NW_DB_PASSWORD=nightwatch_ci \
            postgres:17.11-alpine sh /init/001-roles.sh
      - name: Run database migrations
        run: bun run db:migrate
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/*/coverage/
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run security:audit

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install semgrep
        run: pipx install semgrep==${{ env.SEMGREP_VERSION }}
      - run: bun run security:sast

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: bun run security:secrets

  # Release-stage gate: e2e suite + API container build and scan.
  full:
    name: release-stage (e2e + container)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://nightwatch:nightwatch_ci@localhost:5432/nightwatch
      DATABASE_OWNER_URL: postgres://nightwatch_owner:nightwatch_owner_ci@localhost:5432/nightwatch
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: NightWatch CI <ci@nightwatch.local>
      E2E_REQUIRE_CREDENTIALS: "1"
      E2E_EMAIL: settings-e2e@nightwatch.invalid
      E2E_PASSWORD: "nightwatch-ci-disposable-only-06!"
    services: *db_services
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Generate development secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Create least-privilege runtime database role
        run: |
          docker run --rm --network host \
            -v "$PWD/scripts/db/init:/init:ro" \
            -e POSTGRES_USER=nightwatch_owner \
            -e POSTGRES_DB=nightwatch \
            -e POSTGRES_HOST=localhost \
            -e PGPASSWORD=nightwatch_owner_ci \
            -e NW_DB_PASSWORD=nightwatch_ci \
            postgres:17.11-alpine sh /init/001-roles.sh
      - name: Run database migrations
        run: bun run db:migrate
      - name: Provision dedicated E2E settings fixture
        run: bun run --cwd apps/api provision-e2e-fixture
      - name: Install e2e dependencies
        run: cd e2e && bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: cd e2e && bun x playwright install --with-deps chromium
      - name: e2e tests
        run: bun run e2e
      - name: Install trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
      - name: Container build + scan
        run: bun run security:image
