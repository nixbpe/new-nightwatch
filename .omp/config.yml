# Project-local model routing for .omp/agents role aliases.
# Single chain source: each agent frontmatter declares
# model: ["@role", "@default"]. OMP tries entries in order after expanding
# aliases, so a missing role mapping or unavailable provider falls through
# to the user's own @default. Role targets require auth for their provider;
# whoever lacks it simply lands on @default.
# Note: openai-codex gpt-5.6/gpt-6 models carry toolMode: code_mode_only.
# Project pins codeMode: off (default) so they use direct tools, verified by
# spawn smoke. With 'auto', OMP routes these models through the eval bridge;
# whether that surface fits each role is untested, so the pin stays.
modelRoles:
  # Architecture/contracts, heaviest reasoning
  architect: openai-codex/gpt-6-sol:medium
  # Code and infrastructure implementation
  implement: openai-codex/gpt-6-sol:medium
  # Read-only correctness/security review, evidence-heavy
  review: openai-codex/gpt-6-sol:medium
  # Direction/epic/story/delivery writing
  product: openai-codex/gpt-6-sol:high
  # Feature UI flow, interaction and accessibility
  design: openai-codex/gpt-6-astra:medium

providers:
  openai-codex:
    codeMode: off
